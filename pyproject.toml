[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graph-gardener"
dynamic = ["version"]
description = "LLM-powered knowledge graph maintenance — cleans and enriches memory graphs"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Jaye Marshall", email = "jaye@nexteam.co.uk"},
]
keywords = ["knowledge-graph", "llm", "maintenance", "memory", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.25,<3",
]

[project.urls]
Homepage = "https://github.com/jmars/graph-gardener"
Repository = "https://github.com/jmars/graph-gardener"
Issues = "https://github.com/jmars/graph-gardener/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
graph-gardener = "graph_gardener.__main__:main"

[tool.hatch.version]
path = "src/graph_gardener/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_gardener"]
